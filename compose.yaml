services:
  voice:
    # Gradbot 0.1.9 ships Linux wheels for x86_64. On Apple Silicon use emulation.
    platform: linux/amd64
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8082:8082"
    init: true
    restart: unless-stopped
    stop_grace_period: 25s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
