name: Verify voice bridge
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.16"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: uv run familyshield simulate
      - run: uv build
      - run: docker build -t familyshield:test .
      - name: Container health smoke test
        run: |
          docker run -d --name voice-test -p 127.0.0.1:8082:8082 familyshield:test
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8082/healthz; then exit 0; fi
            sleep 1
          done
          docker logs voice-test
          exit 1
      - if: always()
        run: docker rm -f voice-test || true
