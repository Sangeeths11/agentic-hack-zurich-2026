[project]
name = "familyshield"
version = "0.2.0"
description = "Streaming phone assistant with Twilio, Gradbot and Gradium"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.20,<1",
    "twilio>=9,<10",
    "gradbot==0.1.9",
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "websockets>=14,<18",
]

[project.scripts]
familyshield = "familyshield.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/familyshield"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/**", "/tests/**", "/scripts/**", "/docs/**", "/.github/**",
    "/README.md", "/pyproject.toml", "/uv.lock", "/.python-version",
    "/.env.example", "/Dockerfile", "/compose.yaml", "/.dockerignore", "/.gitignore",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore:'audioop' is deprecated:DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
